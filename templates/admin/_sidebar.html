{{define "admin_head"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{.Title}}</title>
  <meta name="robots" content="noindex, nofollow"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { "bg-primary": "#05070A", "bg-secondary": "#0B111B", gold: "#D4AF37", "accent-blue": "#2D5FFF" } } }
    };
  </script>
  <style>
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); }
    .sidebar-link { display:flex; align-items:center; gap:.75rem; padding:.5rem 1rem; border-radius:.75rem; font-size:.875rem; color:rgba(255,255,255,.6); transition:all .2s; }
    .sidebar-link:hover,.sidebar-link.active { background:rgba(212,175,55,.1); color:#d4af37; }
    .sidebar-link svg { width:1.25rem; height:1.25rem; flex-shrink:0; }
    input,textarea,select { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:.75rem; padding:.5rem .875rem; color:#fff; font-size:.875rem; width:100%; transition:border-color .2s; }
    input:focus,textarea:focus,select:focus { outline:none; border-color:#d4af37; }
    label { font-size:.8125rem; color:rgba(255,255,255,.5); display:block; margin-bottom:.25rem; }
    .btn-save { background:rgba(212,175,55,.1); border:1px solid rgba(212,175,55,.3); color:#d4af37; font-size:.875rem; padding:.4rem 1.25rem; border-radius:.5rem; cursor:pointer; transition:background .2s; }
    .btn-save:hover { background:rgba(212,175,55,.2); }
    .btn-delete { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#f87171; font-size:.75rem; padding:.3rem .75rem; border-radius:.5rem; cursor:pointer; transition:background .2s; }
    .btn-delete:hover { background:rgba(239,68,68,.2); }
    .btn-add { background:rgba(212,175,55,.15); border:1px solid rgba(212,175,55,.4); color:#d4af37; font-size:.875rem; padding:.5rem 1.5rem; border-radius:.75rem; cursor:pointer; transition:background .2s; font-weight:600; }
    .btn-add:hover { background:rgba(212,175,55,.25); }
  </style>
</head>
<body class="bg-bg-primary text-white min-h-screen flex">
{{end}}
