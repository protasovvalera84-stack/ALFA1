<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "bg-primary": "#05070A",
              "bg-secondary": "#0B111B",
              gold: "#D4AF37",
            },
          },
        },
      };
    </script>
    <style>
      .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); }
      .sidebar-link { display:flex; align-items:center; gap:0.75rem; padding:0.625rem 1rem; border-radius:0.75rem; font-size:0.875rem; color:rgba(255,255,255,0.6); transition:all 0.2s; }
      .sidebar-link:hover, .sidebar-link.active { background:rgba(212,175,55,0.1); color:#d4af37; }
      .sidebar-link svg { width:1.25rem; height:1.25rem; flex-shrink:0; }
      input, textarea, select { background:rgba(255,255,255,0.06)!important; color:#fff!important; }
      input:focus, textarea:focus { outline:none; border-color:#d4af37!important; box-shadow:0 0 0 2px rgba(212,175,55,0.2)!important; }
    </style>
  </head>
  <body class="bg-bg-primary text-white min-h-screen flex">
    {{template "sidebar" .}}
    <main class="flex-1 overflow-auto">
      <div class="p-8">
        <div class="flex items-center justify-between mb-8">
          <h1 class="text-2xl font-bold">Преимущества</h1>
          {{if .Saved}}<div class="bg-green-500/10 border border-green-500/30 text-green-400 text-sm px-4 py-2 rounded-xl">Сохранено</div>{{end}}
        </div>

        <!-- Add new -->
        <div class="glass border border-white/10 rounded-2xl p-6 mb-8">
          <h2 class="text-base font-semibold mb-5">Добавить преимущество</h2>
          <form method="POST" action="/admin/advantages">
            <input type="hidden" name="id" value="0" />
            <div class="grid sm:grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm text-white/50 mb-1">Заголовок *</label>
                <input type="text" name="title" required class="w-full border border-white/15 rounded-xl px-3 py-2 text-sm" placeholder="Профессиональная охрана" />
              </div>
              <div>
                <label class="block text-sm text-white/50 mb-1">Порядок сортировки</label>
                <input type="number" name="sort_order" value="0" class="w-full border border-white/15 rounded-xl px-3 py-2 text-sm" />
              </div>
            </div>
            <div class="mb-4">
              <label class="block text-sm text-white/50 mb-1">Описание</label>
              <textarea name="description" rows="2" class="w-full border border-white/15 rounded-xl px-3 py-2 text-sm resize-none" placeholder="Краткое описание преимущества..."></textarea>
            </div>
            <div class="mb-4">
              <label class="block text-sm text-white/50 mb-1">SVG-иконка (необязательно)</label>
              <textarea name="icon" rows="3" class="w-full border border-white/15 rounded-xl px-3 py-2 text-sm font-mono resize-none" placeholder='<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">...</svg>'></textarea>
            </div>
            <div class="flex items-center gap-3">
              <label class="flex items-center gap-2 text-sm text-white/60 cursor-pointer">
                <input type="checkbox" name="active" value="1" checked class="rounded" />
                Активно
              </label>
              <button type="submit" class="ml-auto bg-gold hover:bg-yellow-500 text-black font-bold px-5 py-2 rounded-xl text-sm transition-colors">Добавить</button>
            </div>
          </form>
        </div>

        <!-- List -->
        {{if .Items}}
        <div class="space-y-3">
          {{range .Items}}
          <div class="glass border border-white/10 rounded-2xl p-5">
            <form method="POST" action="/admin/advantages">
              <input type="hidden" name="id" value="{{.ID}}" />
              <div class="grid sm:grid-cols-2 gap-4 mb-3">
                <div>
                  <label class="block text-xs text-white/40 mb-1">Заголовок</label>
                  <input type="text" name="title" value="{{.Title}}" required class="w-full border border-white/10 rounded-xl px-3 py-2 text-sm" />
                </div>
                <div>
                  <label class="block text-xs text-white/40 mb-1">Порядок</label>
                  <input type="number" name="sort_order" value="{{.SortOrder}}" class="w-full border border-white/10 rounded-xl px-3 py-2 text-sm" />
                </div>
              </div>
              <div class="mb-3">
                <label class="block text-xs text-white/40 mb-1">Описание</label>
                <textarea name="description" rows="2" class="w-full border border-white/10 rounded-xl px-3 py-2 text-sm resize-none">{{.Description}}</textarea>
              </div>
              <div class="mb-3">
                <label class="block text-xs text-white/40 mb-1">SVG-иконка</label>
                <textarea name="icon" rows="2" class="w-full border border-white/10 rounded-xl px-3 py-2 text-sm font-mono resize-none">{{.Icon}}</textarea>
              </div>
              <div class="flex items-center gap-4">
                <label class="flex items-center gap-2 text-sm text-white/60 cursor-pointer">
                  <input type="checkbox" name="active" value="1" {{if .Active}}checked{{end}} class="rounded" />
                  Активно
                </label>
                <button type="submit" class="bg-white/5 hover:bg-gold/20 hover:text-gold border border-white/10 text-white/60 font-medium px-4 py-1.5 rounded-lg text-sm transition-colors">Сохранить</button>
                <button type="submit" name="_action" value="delete" onclick="return confirm('Удалить?')" class="ml-auto text-red-400/60 hover:text-red-400 text-sm transition-colors">Удалить</button>
              </div>
            </form>
          </div>
          {{end}}
        </div>
        {{else}}
        <div class="text-center py-16 text-white/30">Нет преимуществ. Добавьте первое.</div>
        {{end}}
      </div>
    </main>
  </body>
</html>
