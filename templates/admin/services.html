<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { "bg-primary": "#05070A", "bg-secondary": "#0B111B", gold: "#D4AF37" },
          },
        },
      };
    </script>
    <style>
      .glass {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px);
      }
      .sidebar-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 1rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.6);
        transition: all 0.2s;
      }
      .sidebar-link:hover,
      .sidebar-link.active {
        background: rgba(212, 175, 55, 0.1);
        color: #d4af37;
      }
      .sidebar-link svg {
        width: 1.25rem;
        height: 1.25rem;
        flex-shrink: 0;
      }
      input,
      textarea {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 0.75rem;
        padding: 0.5rem 0.875rem;
        color: #fff;
        font-size: 0.875rem;
        width: 100%;
        transition: border-color 0.2s;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #d4af37;
      }
      label {
        font-size: 0.8125rem;
        color: rgba(255, 255, 255, 0.5);
        display: block;
        margin-bottom: 0.25rem;
      }
    </style>
  </head>
  <body class="bg-bg-primary text-white min-h-screen flex">
    {{template "sidebar" .}}

    <main class="flex-1 overflow-auto">
      <div class="p-8">
        <div class="flex items-center justify-between mb-8">
          <h1 class="text-2xl font-bold">Управление услугами</h1>
          {{if .Saved}}
          <div
            class="bg-green-500/10 border border-green-500/30 text-green-400 text-sm px-4 py-2 rounded-xl"
          >
            ✓ Сохранено
          </div>
          {{end}}
        </div>

        <p class="text-white/50 text-sm mb-8">
          Редактируйте название и описание услуг. Отключённые услуги не отображаются на сайте.
        </p>

        <div class="space-y-4">
          {{range .Services}}
          <div class="glass border border-white/10 rounded-2xl p-5">
            <form method="POST" action="/admin/services">
              <input type="hidden" name="id" value="{{.ID}}" />
              <div class="grid sm:grid-cols-2 gap-4 mb-4">
                <div>
                  <label>Название услуги</label>
                  <input type="text" name="name" value="{{.Name}}" required />
                </div>
                <div class="flex items-center gap-3 sm:pt-6">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input
                      type="checkbox"
                      name="active"
                      value="1"
                      {{if
                      .Active}}checked{{end}}
                      class="w-4 h-4 accent-yellow-500"
                    />
                    <span class="text-sm text-white/70">Отображать на сайте</span>
                  </label>
                </div>
              </div>
              <div class="mb-4">
                <label>Описание</label>
                <textarea name="description" rows="2">{{.Description}}</textarea>
              </div>
              <button
                type="submit"
                class="bg-gold/10 hover:bg-gold/20 border border-gold/30 text-gold text-sm px-5 py-2 rounded-lg transition-colors"
              >
                Сохранить
              </button>
            </form>
          </div>
          {{end}}
        </div>
      </div>
    </main>
  </body>
</html>
