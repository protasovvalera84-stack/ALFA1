<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title><meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{"bg-primary":"#05070A","bg-secondary":"#0B111B",gold:"#D4AF37"}}}};</script>
    <style>
      .glass{background:rgba(255,255,255,.04);backdrop-filter:blur(12px)}
      .sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.625rem 1rem;border-radius:.75rem;font-size:.875rem;color:rgba(255,255,255,.6);transition:all .2s}
      .sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,.1);color:#d4af37}
      .sidebar-link svg{width:1.25rem;height:1.25rem;flex-shrink:0}
      input,textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:.75rem;padding:.5rem .875rem;color:#fff;font-size:.875rem;width:100%;transition:border-color .2s}
      input:focus,textarea:focus{outline:none;border-color:#d4af37}
      label{font-size:.8125rem;color:rgba(255,255,255,.5);display:block;margin-bottom:.25rem}
    </style>
  </head>
  <body class="bg-bg-primary text-white min-h-screen flex">
    {{template "sidebar" .}}
    <main class="flex-1 overflow-auto">
      <div class="p-8">
        <div class="flex items-center justify-between mb-8">
          <h1 class="text-2xl font-bold">Наши клиенты <span class="text-white/30 text-lg font-normal">— объекты под защитой</span></h1>
          {{if .Saved}}<div class="bg-green-500/10 border border-green-500/30 text-green-400 text-sm px-4 py-2 rounded-xl">✓ Сохранено</div>{{end}}
        </div>
        <!-- Add new -->
        <div class="glass border border-gold/20 rounded-2xl p-5 mb-8">
          <h2 class="text-sm font-semibold text-gold mb-4">+ Добавить клиента</h2>
          <form method="POST" action="/admin/clients">
            <input type="hidden" name="action" value="add" />
            <div class="grid sm:grid-cols-3 gap-4 mb-4">
              <div><label>Буква (аватар)</label><input type="text" name="letter" placeholder="С" maxlength="2" required /></div>
              <div><label>Название компании</label><input type="text" name="name" placeholder="«Советская Звезда»" required /></div>
              <div><label>Отрасль</label><input type="text" name="sector" placeholder="Коммерческая недвижимость" /></div>
            </div>
            <div class="mb-4"><label>Описание</label><textarea name="description" rows="2" placeholder="Краткое описание охраняемого объекта..."></textarea></div>
            <div class="mb-4"><label>Теги (через запятую)</label><input type="text" name="tags" placeholder="Бизнес-центр, КПП" /></div>
            <button type="submit" class="bg-gold/10 hover:bg-gold/20 border border-gold/30 text-gold text-sm px-5 py-2 rounded-lg transition-colors">Добавить</button>
          </form>
        </div>
        <!-- List -->
        <div class="space-y-4">
          {{range .Items}}
          <div class="glass border border-white/10 rounded-2xl p-5">
            <form method="POST" action="/admin/clients">
              <input type="hidden" name="action" value="update" />
              <input type="hidden" name="id" value="{{.ID}}" />
              <div class="grid sm:grid-cols-3 gap-4 mb-4">
                <div><label>Буква</label><input type="text" name="letter" value="{{.Letter}}" maxlength="2" required /></div>
                <div><label>Название</label><input type="text" name="name" value="{{.Name}}" required /></div>
                <div><label>Отрасль</label><input type="text" name="sector" value="{{.Sector}}" /></div>
              </div>
              <div class="mb-4"><label>Описание</label><textarea name="description" rows="2">{{.Description}}</textarea></div>
              <div class="mb-4"><label>Теги</label><input type="text" name="tags" value="{{.Tags}}" /></div>
              <button type="submit" class="bg-gold/10 hover:bg-gold/20 border border-gold/30 text-gold text-sm px-5 py-2 rounded-lg transition-colors">Сохранить</button>
            </form>
            <form method="POST" action="/admin/clients" class="mt-2">
              <input type="hidden" name="action" value="delete" />
              <input type="hidden" name="id" value="{{.ID}}" />
              <button type="submit" onclick="return confirm('Удалить клиента?')" class="text-red-400/60 hover:text-red-400 text-xs px-3 py-1 rounded-lg hover:bg-red-500/10 transition-colors">Удалить</button>
            </form>
          </div>
          {{else}}
          <div class="text-white/30 text-sm p-4">Нет клиентов. Добавьте первого выше.</div>
          {{end}}
        </div>
      </div>
    </main>
  </body>
</html>
