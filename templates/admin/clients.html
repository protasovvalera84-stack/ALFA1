<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{.Title}}</title>
  <meta name="robots" content="noindex, nofollow"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{"bg-primary":"#05070A","bg-secondary":"#0B111B",gold:"#D4AF37"}}}};</script>
  <style>
    .glass{background:rgba(255,255,255,.04);backdrop-filter:blur(12px)}
    .sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.625rem 1rem;border-radius:.75rem;font-size:.875rem;color:rgba(255,255,255,.6);transition:all .2s}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,.1);color:#d4af37}
    .sidebar-link svg{width:1.25rem;height:1.25rem;flex-shrink:0}
    input,textarea,select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:.75rem;padding:.6875rem 1rem;color:#fff;font-size:.875rem}
    input:focus,textarea:focus,select:focus{outline:none;border-color:#d4af37;box-shadow:0 0 0 2px rgba(212,175,55,.2)}
    label{display:block;font-size:.8125rem;color:rgba(255,255,255,.55);margin-bottom:.375rem}
    select option{background:#0b111b}
  </style>
</head>
<body class="bg-bg-primary text-white min-h-screen flex">
{{template "admin_sidebar" .}}
<main class="flex-1 overflow-auto">
  <div class="p-8 max-w-3xl">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-bold">Наши клиенты</h1>
      {{if .Saved}}<div class="bg-green-500/10 border border-green-500/30 text-green-400 text-sm px-4 py-2 rounded-xl">✓ Сохранено</div>{{end}}
    </div>

    {{range .Items}}
    <div class="glass border border-white/10 rounded-2xl p-6 mb-4">
      <form method="POST" action="/admin/clients">
        <input type="hidden" name="id" value="{{.ID}}"/>
        <div class="grid sm:grid-cols-3 gap-4 mb-4">
          <div>
            <label>Буква (аватар)</label>
            <input type="text" name="letter" value="{{.Letter}}" maxlength="2"/>
          </div>
          <div>
            <label>Цвет аватара</label>
            <select name="color_class">
              <option value="gold" {{if eq .ColorClass "gold"}}selected{{end}}>Золотой</option>
              <option value="blue" {{if eq .ColorClass "blue"}}selected{{end}}>Синий</option>
            </select>
          </div>
          <div>
            <label>Отображать</label>
            <select name="active">
              <option value="1" {{if .Active}}selected{{end}}>Да</option>
              <option value="0" {{if not .Active}}selected{{end}}>Нет</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label>Название клиента</label>
            <input type="text" name="name" value="{{.Name}}"/>
          </div>
          <div>
            <label>Тип / отрасль</label>
            <input type="text" name="type_label" value="{{.TypeLabel}}"/>
          </div>
          <div class="sm:col-span-3">
            <label>Описание</label>
            <textarea name="description" rows="2">{{.Description}}</textarea>
          </div>
          <div class="sm:col-span-3">
            <label>Теги (через запятую: Склад,Охрана,24/7)</label>
            <input type="text" name="tags" value="{{.TagsRaw}}"/>
          </div>
        </div>
        <div class="flex gap-3">
          <button type="submit" class="bg-gold hover:bg-yellow-500 text-black font-bold px-5 py-2 rounded-xl text-sm">Сохранить</button>
          <button type="submit" name="action" value="delete" onclick="return confirm('Удалить?')" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 font-bold px-5 py-2 rounded-xl text-sm">Удалить</button>
        </div>
      </form>
    </div>
    {{end}}

    <div class="glass border border-gold/20 rounded-2xl p-6 mt-8">
      <h2 class="font-semibold text-gold mb-4">+ Добавить клиента</h2>
      <form method="POST" action="/admin/clients">
        <input type="hidden" name="action" value="add"/>
        <div class="grid sm:grid-cols-3 gap-4 mb-4">
          <div>
            <label>Буква</label>
            <input type="text" name="letter" placeholder="А" maxlength="2"/>
          </div>
          <div>
            <label>Цвет</label>
            <select name="color_class">
              <option value="gold">Золотой</option>
              <option value="blue">Синий</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label>Название</label>
            <input type="text" name="name" placeholder="Название компании"/>
          </div>
          <div>
            <label>Тип</label>
            <input type="text" name="type_label" placeholder="Коммерческая недвижимость"/>
          </div>
          <div class="sm:col-span-3">
            <label>Описание</label>
            <textarea name="description" rows="2" placeholder="Текст описания"></textarea>
          </div>
          <div class="sm:col-span-3">
            <label>Теги (через запятую)</label>
            <input type="text" name="tags" placeholder="Склад,Охрана"/>
          </div>
        </div>
        <button type="submit" class="bg-gold hover:bg-yellow-500 text-black font-bold px-6 py-2.5 rounded-xl text-sm">Добавить</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
