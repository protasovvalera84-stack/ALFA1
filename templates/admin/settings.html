<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { "bg-primary": "#05070A", "bg-secondary": "#0B111B", gold: "#D4AF37" },
          },
        },
      };
    </script>
    <style>
      .glass {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px);
      }
      .sidebar-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 1rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.6);
        transition: all 0.2s;
      }
      .sidebar-link:hover,
      .sidebar-link.active {
        background: rgba(212, 175, 55, 0.1);
        color: #d4af37;
      }
      .sidebar-link svg {
        width: 1.25rem;
        height: 1.25rem;
        flex-shrink: 0;
      }
      label {
        display: block;
        font-size: 0.8125rem;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 0.375rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 0.75rem;
        padding: 0.6875rem 1rem;
        color: #fff;
        font-size: 0.875rem;
        transition: border-color 0.2s;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: #d4af37;
        box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
      }
      textarea {
        resize: vertical;
      }
      select option {
        background: #0b111b;
      }
    </style>
  </head>
  <body class="bg-bg-primary text-white min-h-screen flex">
    {{template "sidebar" .}}

    <!-- Main -->
    <main class="flex-1 overflow-auto">
      <div class="p-8 max-w-3xl">
        <div class="flex items-center justify-between mb-8">
          <h1 class="text-2xl font-bold">Настройки сайта</h1>
          {{if .Saved}}
          <div
            class="bg-green-500/10 border border-green-500/30 text-green-400 text-sm px-4 py-2 rounded-xl"
          >
            ✓ Сохранено
          </div>
          {{end}}
        </div>

        <form method="POST" action="/admin/settings" class="space-y-8">
          <!-- General info -->
          <div class="glass border border-white/10 rounded-2xl p-6">
            <h2 class="font-semibold text-base mb-5 text-gold">Общая информация</h2>
            <div class="grid sm:grid-cols-2 gap-5">
              <div>
                <label>SEO заголовок сайта</label>
                <input type="text" name="site_title" value="{{.Settings.SiteTitle}}" />
              </div>
              <div>
                <label>Название компании</label>
                <input type="text" name="company_name" value="{{.Settings.CompanyName}}" />
              </div>
              <div class="sm:col-span-2">
                <label>SEO описание сайта (meta description)</label>
                <textarea name="site_description" rows="2">{{.Settings.SiteDescription}}</textarea>
              </div>
            </div>
          </div>

          <!-- Hero section -->
          <div class="glass border border-white/10 rounded-2xl p-6">
            <h2 class="font-semibold text-base mb-5 text-gold">Hero-блок (первый экран)</h2>
            <div class="space-y-4">
              <div>
                <label>Главный заголовок</label>
                <input type="text" name="hero_title" value="{{.Settings.HeroTitle}}" />
              </div>
              <div>
                <label>Подзаголовок</label>
                <input type="text" name="hero_subtitle" value="{{.Settings.HeroSubtitle}}" />
              </div>
            </div>
          </div>

          <!-- About section -->
          <div class="glass border border-white/10 rounded-2xl p-6">
            <h2 class="font-semibold text-base mb-5 text-gold">О компании</h2>
            <div class="space-y-4">
              <div>
                <label>Текст блока «О компании»</label>
                <textarea name="about_text" rows="4">{{.Settings.AboutText}}</textarea>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div>
                  <label>Лет на рынке</label>
                  <input type="text" name="stats_years" value="{{.Settings.StatsYears}}" />
                </div>
                <div>
                  <label>Объектов</label>
                  <input type="text" name="stats_objects" value="{{.Settings.StatsObjects}}" />
                </div>
                <div>
                  <label>Сотрудников</label>
                  <input type="text" name="stats_staff" value="{{.Settings.StatsStaff}}" />
                </div>
                <div>
                  <label>Лицензий</label>
                  <input type="text" name="stats_licenses" value="{{.Settings.StatsLicenses}}" />
                </div>
              </div>
            </div>
          </div>

          <!-- Contacts -->
          <div class="glass border border-white/10 rounded-2xl p-6">
            <h2 class="font-semibold text-base mb-5 text-gold">Контактная информация</h2>
            <div class="grid sm:grid-cols-2 gap-4">
              <div>
                <label>Телефон 1</label>
                <input type="text" name="phone1" value="{{.Settings.Phone1}}" />
              </div>
              <div>
                <label>Телефон 2</label>
                <input type="text" name="phone2" value="{{.Settings.Phone2}}" />
              </div>
              <div>
                <label>Телефон HR</label>
                <input type="text" name="phone_hr" value="{{.Settings.PhoneHR}}" />
              </div>
              <div>
                <label>Email</label>
                <input type="email" name="email" value="{{.Settings.Email}}" />
              </div>
              <div class="sm:col-span-2">
                <label>Адрес (основной)</label>
                <input type="text" name="address" value="{{.Settings.Address}}" />
              </div>
              <div class="sm:col-span-2">
                <label>Адрес (дополнительный)</label>
                <input type="text" name="address2" value="{{.Settings.Address2}}" />
              </div>
              <div>
                <label>Режим работы</label>
                <input type="text" name="working_hours" value="{{.Settings.WorkingHours}}" />
              </div>
              <div>
                <label>Домен сайта (для SEO)</label>
                <input
                  type="text"
                  name="domain"
                  value="{{.Settings.Domain}}"
                  placeholder="https://alfaunit1.ru"
                />
              </div>
            </div>
          </div>

          <!-- Security -->
          <div class="glass border border-white/10 rounded-2xl p-6">
            <h2 class="font-semibold text-base mb-5 text-gold">Безопасность</h2>
            <div class="max-w-sm">
              <label>Новый пароль администратора</label>
              <input
                type="password"
                name="new_password"
                placeholder="Оставьте пустым, чтобы не менять"
                autocomplete="new-password"
              />
              <p class="text-white/30 text-xs mt-2">
                Минимум 8 символов. Храните в безопасном месте.
              </p>
            </div>
          </div>

          <button
            type="submit"
            class="bg-gold hover:bg-yellow-500 text-black font-bold px-8 py-3 rounded-xl transition-colors"
          >
            Сохранить настройки
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
