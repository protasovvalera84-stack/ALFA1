{{template "admin_head" .}}
{{template "admin_sidebar" .}}
<main class="flex-1 overflow-auto">
  <div class="p-8 max-w-4xl">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">Наши клиенты</h1>
      {{if .Saved}}<div class="bg-green-500/10 border border-green-500/30 text-green-400 text-sm px-4 py-2 rounded-xl">✓ Сохранено</div>{{end}}
    </div>
    <p class="text-white/50 text-sm mb-8">Карточки охраняемых объектов. Теги вводятся через запятую.</p>

    <!-- Add new -->
    <div class="glass border border-gold/20 rounded-2xl p-5 mb-8">
      <h2 class="text-sm font-semibold text-gold mb-4">+ Добавить клиента</h2>
      <form method="POST" action="/admin/clients">
        <input type="hidden" name="action" value="add"/>
        <div class="grid sm:grid-cols-3 gap-3 mb-3">
          <div><label>Буква/Инициал</label><input type="text" name="initial" placeholder="А" maxlength="3"/></div>
          <div><label>Название компании *</label><input type="text" name="name" required placeholder="ООО «Компания»"/></div>
          <div><label>Тип объекта</label><input type="text" name="type_label" placeholder="Строительное предприятие"/></div>
        </div>
        <div class="mb-3"><label>Описание</label><textarea name="description" rows="2" placeholder="Краткое описание работы..."></textarea></div>
        <div class="mb-4"><label>Теги (через запятую)</label><input type="text" name="tags" placeholder="Строительство,Периметр,24/7"/></div>
        <button type="submit" class="btn-add">Добавить</button>
      </form>
    </div>

    <!-- Existing items -->
    <div class="space-y-3">
      {{range .Items}}
      <div class="glass border border-white/10 rounded-2xl p-5">
        <form method="POST" action="/admin/clients">
          <input type="hidden" name="id" value="{{.ID}}"/>
          <div class="grid sm:grid-cols-3 gap-3 mb-3">
            <div><label>Буква/Инициал</label><input type="text" name="initial" value="{{.Initial}}" maxlength="3"/></div>
            <div><label>Название компании</label><input type="text" name="name" value="{{.Name}}" required/></div>
            <div><label>Тип объекта</label><input type="text" name="type_label" value="{{.TypeLabel}}"/></div>
          </div>
          <div class="mb-3"><label>Описание</label><textarea name="description" rows="2">{{.Description}}</textarea></div>
          <div class="mb-3">
            <label>Теги (через запятую)</label>
            <input type="text" name="tags" value="{{range $i,$t := .Tags}}{{if $i}},{{end}}{{$t}}{{end}}"/>
          </div>
          <div class="flex items-center gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" name="active" value="1" {{if .Active}}checked{{end}} class="w-4 h-4 accent-yellow-500"/>
              <span class="text-sm text-white/70">Показывать на сайте</span>
            </label>
            <button type="submit" class="btn-save">Сохранить</button>
            <button type="submit" name="action" value="delete" class="btn-delete" onclick="return confirm('Удалить?')">Удалить</button>
          </div>
        </form>
      </div>
      {{end}}
    </div>
  </div>
</main>
</body></html>
